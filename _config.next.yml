# NexT 8 Alternate Theme Config
# Docs: https://theme-next.js.org/docs/getting-started/configuration

cache:
  enable: true

minify: false

custom_file_path:
  style: source/_data/styles.styl

# Schemes
scheme: Muse
darkmode: false

favicon:
  small: /images/favicon-16x16-next.png
  medium: /images/favicon-32x32-next.png
  apple_touch_icon: /images/apple-touch-icon-next.png
  safari_pinned_tab: /images/logo.svg

creative_commons:
  license: by-nc-sa
  size: small
  sidebar: false
  post: false

menu:
  home: / || fa fa-home
  about: /about/ || fa fa-user
  tags: /tags/ || fa fa-tags
  categories: /categories/ || fa fa-th
  archives: /archives/ || fa fa-archive
  sitemap: /sitemap.xml || fa fa-sitemap
  commonweal: /404/ || fa fa-heartbeat

menu_settings:
  icons: true
  badges: false

sidebar:
  position: right
  display: post
  padding: 18
  offset: 12

avatar:
  url: /images/avatar.jpg
  rounded: true
  rotated: false

site_state: true

social:
  E-Mail: mailto:1270256946@qq.com || fa fa-envelope

social_icons:
  enable: true
  icons_only: false
  transition: false

links_settings:
  icon: fa fa-globe
  layout: inline

links:
  Shen博客: http://www.shenliyang.com
  Steven博客: https://xiaosuda.top
  Naice博客: https://blog.naice.me

toc:
  enable: true
  number: true
  wrap: false
  expand_all: false
  max_depth: 6

footer:
  since: 2018
  icon:
    name: fa fa-user
    animated: false
    color: "#808080"
  powered: true
  beian:
    enable: false

index_with_subtitle: true

exturl: false

codeblock:
  copy_button:
    enable: true
    style: flat
  theme:
    light: default
    dark: stackoverflow-dark

back2top:
  enable: true
  sidebar: false
  scrollpercent: false

reading_progress:
  enable: false

bookmark:
  enable: false

github_banner:
  enable: false

follow_me:

related_posts:
  enable: false

post_edit:
  enable: false

# Comments: Valine via hexo-next-valine
valine:
  enable: true
  appId: sgCCneH9wY92eX2UEB9Wrl4g-gzGzoHsz
  appKey: NOA0dKCDe3V0INrgD42m9Muf
  serverURLs:
  placeholder: ヾﾉ≧∀≦)o来啊，快活啊!
  avatar: mp
  meta:
    - nick
    - mail
    - link
  pageSize: 10
  visitor: false
  comment_count: true
  recordIP: false
  enableQQ: false
  requiredFields: []
  lang: zh-cn

busuanzi_count:
  enable: true
  total_visitors: true
  total_visitors_icon: fa fa-user
  total_views: true
  total_views_icon: fa fa-eye
  post_views: true
  post_views_icon: far fa-eye

algolia_search:
  enable: true
  hits:
    per_page: 10

local_search:
  enable: false

motion:
  enable: true

fancybox: true

vendors:
  internal: local
  plugins: cdnjs
