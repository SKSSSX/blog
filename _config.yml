# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: sanks的博客
subtitle: 知识付诸行动才有转换为能力的效果
description: 分享前端工程、三维 GIS、实时推送与全栈架构的实战笔记——Vue、Cesium、Node.js、SSE/WebRTC 等
keywords:
  - JavaScript
  - Vue
  - Cesium
  - GIS
  - Nodejs
  - SSE
  - WebRTC
  - 架构
  - 前端工程化
  - hexo
author: sanks
language: zh-CN
timezone: Asia/Shanghai

# URL
url: https://www.sanks-blog.com
root: /
permalink: :title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - README.md
  - 404.html

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
# 中英文之间自动加空格（Hexo 内置）
# auto_spacing was removed in newer Hexo; keep spacing via editor/plugins if needed
syntax_highlighter: highlight.js
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Archive pages
archive_generator:
  per_page: 10
  yearly: true
  monthly: true
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: date

# Pagination
per_page: 10
pagination_dir: page

include:
exclude:
ignore:

# Extensions
theme: next

# Deployment
deploy:
  - type: git
    repository: https://github.com/SKSSSX/SKSSSX.github.io.git
    branch: master

# Server
server:
  compress: true
  port: 3111

# Local search index (hexo-generator-searchdb)
search:
  path: search.xml
  field: post
  content: true
  format: html

# RSS
feed:
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content:
  content_limit: 140
  content_limit_delim: ' '
  order_by: -date
  icon: icon.png

# 博客加密（hexo-blog-encrypt v4）
encrypt:
  enable: true

# 站点地图
sitemap:
  path: sitemap.xml
baidusitemap:
  path: baidusitemap.xml

# nofollow（hexo-filter-nofollow）
nofollow:
  enable: true
  field: site
  exclude:
    - www.sanks-blog.com
