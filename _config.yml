# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: 盛克思的博客
subtitle: 一命二运三本事
description: 对于Javascript（ES6）、VUE、NodeJS、 等相关技术的实战经验分享
keywords:
  - javascript
  - hexo
  - ES6
  - VUE
  - axios
  - promise
  - permission
  - 回调地狱
  - Element-UI
author: shengkesi
language: zh-CN
timezone:

# URL
## If your site is put in a subdirectory, set url as 'http://yoursite.com/child' and root as '/child/'
url: https://www.shengkesi.cn
root: /
# permalink: :year/:month/:day/:title/
permalink: :title/
permalink_defaults:

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
    - README.md
    - 404.html

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
auto_spacing: true # 在中文和英文之间加入空格
titlecase: false # Transform title into titlecase
external_link: true # Open external links in new tab
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace:
  
# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date
  
# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: next

# Deployment
## Docs: https://hexo.io/docs/deployment.html
deploy:
  - type: git
  #repository: git@github.com:SKSSSX/SKSSSX.github.io.git
    repository: git@47.244.17.148:/var/repo/blog.git
    branch: master
  - type: baidu_url_submitter
# Server
server:
  compress: true # 开启压缩
# plugins
# plugins:
#   - hexo-algoliasearch
# algolia
algolia:
  appId: "HRORNW2LY2"
  apiKey: "ded44ecb6cb09def6a2a97166489710c"
  adminApiKey: "6a11a6dad4c8ffe9535d7ce540fb9271"
  chunkSize: 5000
  indexName: "blog"
  fields:
    - content:strip:truncate,0,500
    - excerpt:strip
    - gallery
    - permalink
    - photos
    - slug
    - tags
    - title
# RSS
feed:
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content:
  content_limit: 140
  content_limit_delim: ' '
  order_by: -date
  icon: icon.png

# 博客加密
encrypt:
  enable: true

# 站点地图
sitemap:
  path: sitemap.xml
baidusitemap:
  path: baidusitemap.xml

# nofollow插件
nofollow:
    enable: true
    exclude:
    - www.shengkesi.cn

# 百度链接自动提交
baidu_url_submit:
  count: 6 # 提交最新的链接数量
  host: http://www.shengkesi.cn # 在百度站长平台中注册的域名
  token: iRQU049tuKMtGUma # 请注意这是您的秘钥， 所以请不要把博客源代码发布在公众仓库里!
  path: baidu_urls.txt # 文本文档的地址， 新链接会保存在此文本文档里

# 为博客加上萌萌的宠物
live2d:
  enable: false
  scriptFrom: local
  pluginRootPath: live2dw/
  pluginJsPath: lib/
  pluginModelPath: assets/
  tagMode: false
  log: false
  model:
    use: live2d-widget-model-wanko
  display:
    position: right
    width: 150
    height: 300
  mobile:
    show: true
