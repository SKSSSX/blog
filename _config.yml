# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: sanks的博客
subtitle: 知识付诸行动才有转换为能力的效果
description: 对于JavaScript(ES6)、VUE、React、NodeJS、等相关技术的实战经验分享
keywords:
  - javascript
  - hexo
  - ES6
  - VUE
  - axios
  - promise
  - permission
  - 回调地狱
  - Element-UI
  - NodeJS
author: sanks
language: zh-CN
timezone: Asia/Shanghai

# URL
url: https://www.sanks-blog.com
root: /
permalink: :title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - README.md
  - 404.html

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
# 中英文之间自动加空格（Hexo 内置）
# auto_spacing was removed in newer Hexo; keep spacing via editor/plugins if needed
syntax_highlighter: highlight.js
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: date

# Pagination
per_page: 10
pagination_dir: page

include:
exclude:
ignore:

# Extensions
theme: next

# Deployment
deploy:
  - type: git
    repository: git@github.com:SKSSSX/SKSSSX.github.io.git
    branch: master
  - type: baidu_url_submitter

# Server
server:
  compress: true
  port: 3111

# Algolia（索引写入用 adminApiKey / 环境变量 ALGOLIA_ADMIN_API_KEY）
algolia:
  appId: "HRORNW2LY2"
  apiKey: "ded44ecb6cb09def6a2a97166489710c"
  adminApiKey: "6a11a6dad4c8ffe9535d7ce540fb9271"
  chunkSize: 5000
  indexName: "blog"
  fields:
    - content:strip:truncate,0,500
    - excerpt:strip
    - gallery
    - permalink
    - photos
    - slug
    - tags
    - title

# RSS
feed:
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content:
  content_limit: 140
  content_limit_delim: ' '
  order_by: -date
  icon: icon.png

# 博客加密（hexo-blog-encrypt v4）
encrypt:
  enable: true

# 站点地图
sitemap:
  path: sitemap.xml
baidusitemap:
  path: baidusitemap.xml

# nofollow（hexo-filter-nofollow）
nofollow:
  enable: true
  field: site
  exclude:
    - www.sanks-blog.com

# 百度链接自动提交
baidu_url_submit:
  count: 6
  host: http://www.sanks-blog.com
  token: iRQU049tuKMtGUma
  path: baidu_urls.txt
